[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-lap-time"
version = "0.1.0"
description = "Reproducible F1 lap-time linear regression lab"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "joblib",
  "matplotlib",
  "seaborn",
  "streamlit",
  "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_lap_time"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
